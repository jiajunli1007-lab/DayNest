name: Windows build validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.15.0'
          architecture: x64
      - name: Install project dependencies in an isolated environment
        shell: pwsh
        run: |
          python -m venv .venv-diagnostic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-diagnostic\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run automated tests
        shell: pwsh
        run: |
          .\.venv-diagnostic\Scripts\python.exe -B -m unittest discover -s tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and smoke-test the standalone application
        shell: pwsh
        run: |
          .\.venv-diagnostic\Scripts\python.exe -B -m tools.build_windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $builds = @(Get-ChildItem -LiteralPath '.build-tmp' -Directory -Filter 'build-*')
          if ($builds.Count -ne 1) { throw 'Expected exactly one fresh build directory.' }
          $exe = Join-Path $builds[0].FullName 'dist\DayNest\DayNest.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Packaged executable was not found.' }
          $data = Join-Path $env:RUNNER_TEMP 'daynest-validation-data'
          New-Item -ItemType Directory -Path $data -ErrorAction Stop | Out-Null
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($key in @('PYTHONHOME', 'PYTHONPATH', 'VIRTUAL_ENV', 'QT_PLUGIN_PATH', 'QT_QPA_PLATFORM_PLUGIN_PATH')) {
            Remove-Item -LiteralPath "Env:$key" -ErrorAction SilentlyContinue
          }
          $p = Start-Process -FilePath $exe -ArgumentList @('--data-dir', ('"' + $data + '"'), '--smoke-test', '-platform', 'offscreen') -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'The packaged application did not exit within 30 seconds.' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path -LiteralPath (Join-Path $data 'daynest.sqlite3'))) {
            throw "Packaged smoke test failed with exit code $($p.ExitCode)."
          }
          Write-Output 'Packaged application started, created a database, and exited successfully.'

