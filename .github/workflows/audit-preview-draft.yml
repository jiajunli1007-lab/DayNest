name: Audit uploaded Windows preview draft

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-preview-draft.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.repository == 'jiajunli1007-lab/DayNest'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.15.0'
          architecture: x64
      - name: Download and check the actual unpublished assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/433764783" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.draft -or $release.tag_name -ne 'v0.1.0-preview.1') {
            throw 'Expected unpublished preview draft was not found.'
          }
          $dir = Join-Path $PWD '.build-tmp\draft-audit'
          New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
          $expected = @(
            @{ id = 709050472; name = 'DayNest-Windows-x64-preview-review.zip'; file = 'app.zip'; hash = 'c227e3858f2982514c70cdcdab5108e941ac441db6e0cb5d86be1cf42a8f1ca7' },
            @{ id = 709050451; name = 'DayNest-Qt-6.12.0-sources-review.zip'; file = 'sources.zip'; hash = '149d143f92a1eb016b36863c30cc8612329b2b0627bf090446aad80800cd639b' }
          )
          foreach ($item in $expected) {
            $asset = @($release.assets | Where-Object { $_.id -eq $item.id })
            if ($asset.Count -ne 1 -or $asset[0].name -ne $item.name -or $asset[0].digest -ne ('sha256:' + $item.hash)) {
              throw 'Draft asset metadata did not match.'
            }
            $output = Join-Path $dir $item.file
            $errorFile = Join-Path $dir ($item.file + '.stderr')
            $arguments = @('api', '-H', '"Accept: application/octet-stream"', "repos/$env:GITHUB_REPOSITORY/releases/assets/$($item.id)")
            $p = Start-Process -FilePath (Get-Command gh).Source -ArgumentList $arguments -NoNewWindow -PassThru -Wait -RedirectStandardOutput $output -RedirectStandardError $errorFile
            if ($p.ExitCode -ne 0) { throw "Draft asset download failed: $($item.id)" }
            if ((Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash.ToLowerInvariant() -ne $item.hash) {
              throw "Downloaded asset SHA-256 mismatch: $($item.id)"
            }
          }
      - name: Compare Qt binaries with verified official wheels
        shell: pwsh
        run: |
          $dir = Join-Path $PWD '.build-tmp\draft-audit'
          $wheels = Join-Path $dir 'wheels'
          New-Item -ItemType Directory -Path $wheels -ErrorAction Stop | Out-Null
          python -m pip download --disable-pip-version-check --no-deps --index-url https://pypi.org/simple --dest $wheels 'PySide6_Essentials==6.12.0' 'shiboken6==6.12.0'
          if ($LASTEXITCODE -ne 0) { throw 'Official wheel download failed.' }
          python -B -m tools.audit_preview_wheels --package (Join-Path $dir 'app.zip') --qt-sources (Join-Path $dir 'sources.zip') --wheel-dir $wheels
          if ($LASTEXITCODE -ne 0) { throw 'Official wheel comparison failed.' }
      - name: Test the uploaded package after extraction
        shell: pwsh
        run: |
          $dir = Join-Path $PWD '.build-tmp\draft-audit'
          $unpacked = Join-Path $dir 'unpacked'
          Expand-Archive -LiteralPath (Join-Path $dir 'app.zip') -DestinationPath $unpacked
          $data = Join-Path $dir 'data'
          New-Item -ItemType Directory -Path $data -ErrorAction Stop | Out-Null
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($key in @('PYTHONHOME', 'PYTHONPATH', 'VIRTUAL_ENV', 'QT_PLUGIN_PATH', 'QT_QPA_PLATFORM_PLUGIN_PATH')) {
            Remove-Item -LiteralPath "Env:$key" -ErrorAction SilentlyContinue
          }
          $p = Start-Process -FilePath (Join-Path $unpacked 'DayNest\DayNest.exe') -ArgumentList @('--data-dir', ('"' + $data + '"'), '--smoke-test', '-platform', 'offscreen') -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Downloaded package smoke test timed out.' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path -LiteralPath (Join-Path $data 'daynest.sqlite3'))) {
            throw "Downloaded package smoke test failed: $($p.ExitCode)"
          }
