name: Audit public preview draft assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-public-preview.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.repository == 'jiajunli1007-lab/DayNest'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.15.0'
          architecture: x64
      - name: Download and verify the two draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read release metadata.' }
          $release = @($releases | Where-Object { $_.draft -and $_.tag_name -eq 'v0.1.0-preview.2' })
          if ($release.Count -ne 1 -or @($release[0].assets).Count -ne 2) { throw 'Expected preview draft was not found.' }
          $dir = Join-Path $PWD '.build-tmp\public-draft-audit'
          New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
          $expected = @(
            @{ name = 'DayNest-Windows-x64-preview.zip'; file = 'app.zip' },
            @{ name = 'DayNest-Qt-6.12.0-sources.zip'; file = 'sources.zip' }
          )
          foreach ($item in $expected) {
            $asset = @($release[0].assets | Where-Object { $_.name -eq $item.name -and $_.state -eq 'uploaded' })
            if ($asset.Count -ne 1 -or $asset[0].digest -notmatch '^sha256:([0-9a-f]{64})$') { throw 'Asset metadata is incomplete.' }
            $hash = $Matches[1]
            if (-not $release[0].body.Contains("$hash  $($item.name)")) { throw 'Release notes do not match the asset digest.' }
            $output = Join-Path $dir $item.file
            $errorFile = Join-Path $dir ($item.file + '.stderr')
            $arguments = @('api', '-H', '"Accept: application/octet-stream"', "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset[0].id)")
            $p = Start-Process -FilePath (Get-Command gh).Source -ArgumentList $arguments -NoNewWindow -PassThru -Wait -RedirectStandardOutput $output -RedirectStandardError $errorFile
            if ($p.ExitCode -ne 0) { throw "Draft asset download failed: $($item.name)" }
            if ((Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw "Downloaded asset checksum mismatch: $($item.name)" }
          }
      - name: Verify official Qt binaries and source archives
        shell: pwsh
        run: |
          $dir = Join-Path $PWD '.build-tmp\public-draft-audit'
          $wheels = Join-Path $dir 'wheels'
          New-Item -ItemType Directory -Path $wheels -ErrorAction Stop | Out-Null
          python -m pip download --disable-pip-version-check --no-deps --index-url https://pypi.org/simple --dest $wheels 'PySide6_Essentials==6.12.0' 'shiboken6==6.12.0'
          if ($LASTEXITCODE -ne 0) { throw 'Official wheel download failed.' }
          python -B -m tools.audit_preview_wheels --package (Join-Path $dir 'app.zip') --qt-sources (Join-Path $dir 'sources.zip') --wheel-dir $wheels --release-preview
          if ($LASTEXITCODE -ne 0) { throw 'Preview audit failed.' }
      - name: Test the downloaded Windows application
        shell: pwsh
        run: |
          $dir = Join-Path $PWD '.build-tmp\public-draft-audit'
          $unpacked = Join-Path $dir 'unpacked'
          Expand-Archive -LiteralPath (Join-Path $dir 'app.zip') -DestinationPath $unpacked
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($key in @('PYTHONHOME', 'PYTHONPATH', 'VIRTUAL_ENV', 'QT_PLUGIN_PATH', 'QT_QPA_PLATFORM_PLUGIN_PATH')) {
            Remove-Item -LiteralPath "Env:$key" -ErrorAction SilentlyContinue
          }
          for ($i = 1; $i -le 3; $i++) {
            $data = Join-Path $dir "data-$i"
            New-Item -ItemType Directory -Path $data -ErrorAction Stop | Out-Null
            $p = Start-Process -FilePath (Join-Path $unpacked 'DayNest\DayNest.exe') -ArgumentList @('--data-dir', ('"' + $data + '"'), '--smoke-test', '-platform', 'offscreen') -PassThru
            if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Downloaded package smoke test timed out.' }
            if ($p.ExitCode -ne 0 -or -not (Test-Path -LiteralPath (Join-Path $data 'daynest.sqlite3'))) { throw 'Downloaded package smoke test failed.' }
          }
