name: Prepare Windows preview draft

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-preview-draft.yml'

permissions:
  contents: write

jobs:
  prepare-draft:
    if: github.repository == 'jiajunli1007-lab/DayNest'
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.15.0'
          architecture: x64
      - name: Prepare and verify draft assets
        shell: pwsh
        run: .\tools\prepare_preview_draft.ps1
      - name: Create a private Release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Join-Path $PWD '.build-tmp\draft-assets'
          $app = Join-Path $assets 'DayNest-Windows-x64-preview-待审核.zip'
          $source = Join-Path $assets 'DayNest-Qt-6.12.0-sources-待审核.zip'
          $notes = Join-Path $assets 'draft-notes.txt'
          gh release create 'v0.1.0-preview.1' $app $source --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'DayNest Windows 预览版（待审核）' --notes-file $notes --draft --prerelease
          if ($LASTEXITCODE -ne 0) { throw "草稿创建或附件上传失败：$LASTEXITCODE" }
